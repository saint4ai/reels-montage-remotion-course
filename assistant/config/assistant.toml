# Настройки ассистента. Всё, чего здесь нет, берётся из значений по умолчанию в app/config.py.
# Файл перечитывается сам, перезапуск не нужен (для команд deploy/update.sh достаточно загрузить файлы).

[assistant]
enabled = true            # false: ассистент не отвечает на вопросы, но материал по кодовому слову уходит всегда
max_chars = 350           # длина одного ответа, знаков
history_messages = 20     # сколько последних сообщений диалога видит модель
buffer_seconds = 2        # несколько сообщений подряд склеиваются в один ответ
buffer_max_seconds = 20   # дольше этого с первого сообщения не ждём
max_output_tokens = 1200  # запас на рассуждения модели; ответ короткий, но рассуждающей модели нужен запас
reasoning_effort = "none"   # для gpt-6-luna с вызовом функций нужно "none". Провайдер не знает параметр: код сам уберёт его и повторит. Пусто: не передавать

[channels]
comments = ["instagram"]                         # где ловим кодовые слова под постами
direct = ["instagram", "whatsapp", "telegram"]   # где ассистент отвечает в переписке

[limits]
per_person_per_day = 30            # ответов ассистента одному человеку в сутки
global_per_day = 500               # потолок ответов в сутки на всех (защита от расхода и от накрутки)
material_per_person_per_day = 5    # выдач материала в директе одному человеку в сутки

[lead]
pause_hours = 12   # на сколько часов ассистент замолкает в диалоге после заявки

[owner]
reply_pause_minutes = 60   # пауза после того, как ты сам ответил человеку из приложения
echo_wait_seconds = 3      # пауза перед проверкой «это наше сообщение или твоё»

[reminder]
enabled = true
after_hours = 4        # через сколько часов молчания напомнить (один раз на человека)
window_hours = 22      # окно Meta 24 часа, берём с запасом
quiet_from = 22        # ночью не пишем (час по местному времени ниже)
quiet_to = 9
tz_offset_hours = 5    # сдвиг от UTC: Алматы 5, Москва 3, Ташкент 5

[voice]
enabled = true
model = "gpt-4o-mini-transcribe"   # если OpenAI снимет модель, поставь whisper-1
max_mb = 20

[vision]
enabled = true
model = ""     # пусто: та же модель, что для ответов
max_mb = 10

[checks]
# Обещания результата: ответ с таким словом перепишется, а на втором промахе уйдёт нейтральная заготовка
promises = [
    "гарантирую", "гарантируем", "гарантия", "гарантированно", "100%", "сто процентов",
    "точно получится", "точно получишь", "точно получите", "обязательно заработ",
    "вернём деньги", "верну деньги", "без риска", "быстро разбогат",
]
# Штампы ИИ
slop = [
    "не стесняйтесь", "не стесняйся", "надеюсь, это поможет", "буду рад помочь",
    "в современном мире", "уникальн", "инновацион", "революцион",
]

[intent]
# «Лёгкий РОП»: по словам в сообщении определяем, что человеку нужно сейчас.
# Услугу предлагаем мягко и один раз, только если человек сам заговорил об услугах.
service = [
    "сколько стоит", "цена", "цены", "стоимость", "прайс", "тариф", "услуг", "заказать", "заказ ",
    "под ключ", "сделайте", "сделаешь", "сделаете", "записаться", "запись", "консультац",
    "разработ", "купить", "оплат", "хочу работать", "ваши условия",
]
material = [
    "не получается", "не работает", "не открывается", "ссылка", "ссылку", "как установить",
    "как запустить", "установ", "не пришло", "не пришёл", "где материал", "не могу скачать",
    "скачать", "ошибка", "не пошло", "застрял",
]
