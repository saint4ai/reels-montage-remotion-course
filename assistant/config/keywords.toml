# Кодовые слова под роликами и что по ним уходит человеку.
#
# Человек пишет слово в комментарии: ассистент отвечает под комментарием (текст из texts.toml, раздел
# [public_reply], с @ником) и отправляет материал в директ. Слово можно написать и в директе, если
# сообщение короткое (до трёх слов). Материал уходит всегда, даже если ассистент для переписки выключен.
#
# Поля слова:
#   word           слово, как его видят в ролике (любой регистр и раскладка, mcp и мср считаются одним словом)
#   title          как слово звучит в журнале и подсказках
#   variants       другие написания: ["папку", "папка"]. Опечатку в одну букву код ловит сам
#   match          как искать:
#                    "word"  слово отдельным токеном (по умолчанию): «хочу папка» находит, «папкаа» нет
#                    "exact" весь комментарий равен слову: для обычных слов вроде «сайт», «защита»
#                    "stem"  вхождение: основа «папк» находит «папку» и «скинь папку»
#   active         false: слово не работает (черновик). Новое слово включай после проверки текста
#   comments_only  true: слово работает только под роликом, в директе нет
#   message        текст материала по шаблону: «Держи», ссылки, «Как запустить» по шагам, «Нужно»
#
# Порядок важен: срабатывает первое подходящее слово сверху вниз. Если одно слово входит в другое
# («код» и «читкод»), длинное ставь выше.
#
# Правила текста: без длинного тире, короткие предложения, ссылки полные (https://...),
# шаги нумеруются, в конце одной строкой «Нужно: ...».

[[keyword]]
word = "ПРИМЕР"
title = "пример"
active = false
match = "word"
variants = []
message = """Держи [[ЗАПОЛНИ: что человек получает, одной фразой]]

[[ЗАПОЛНИ: ссылки на материал, каждая с новой строки]]

Как запустить:
1. [[ЗАПОЛНИ: шаг 1]]
2. [[ЗАПОЛНИ: шаг 2]]
3. [[ЗАПОЛНИ: шаг 3]]
4. [[ЗАПОЛНИ: шаг 4]]

Нужно: [[ЗАПОЛНИ: что должно быть у человека: подписка, аккаунт, программа]]"""
