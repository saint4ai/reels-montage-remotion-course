# Тексты, которые ассистент отправляет людям сам. Правила: без длинного тире, короткие предложения,
# без цен и обещаний. Вариантов много и они уходят вразнобой: Instagram режет страницы,
# которые одинаково отвечают на сотни комментариев.
#
# Формы слов нейтральные («проверь», «забирай», «улетело»), чтобы подходили и владельцу, и владелице.

# Публичный ответ под комментарием с кодовым словом. Код сам ставит в начало @ник человека.
# Материал уходит в директ раньше этого ответа, поэтому «уже в директе» всегда правда.
[public_reply]
templates = [
    "Спасибо за комментарий, всё уже в директе, проверь",
    "Улетело в личку, загляни в директ",
    "Готово, материал ждёт в директе",
    "Спасибо за интерес! Смотри директ, там всё есть",
    "Всё в личных сообщениях. Если не видишь, загляни в запросы сообщений",
    "Материал уже в директе, забирай",
    "Только что отправлено, проверь директ",
    "Отправлено в директ, загляни туда",
    "Спасибо! Проверь директ, там материал",
    "Загляни в личные сообщения, всё уже там. Не нашёл? Проверь запросы",
]

# Если ответ модели не прошёл проверки дважды (слишком длинный, чужая ссылка или сумма и так далее)
[fallback]
neutral = "Уточню этот момент и вернусь с ответом."

[limits]
# Человек исчерпал суточный лимит ответов ассистента (один раз за сутки, дальше молчим)
person_notice = "Лимит сообщений ассистента на сегодня исчерпан. Продолжим завтра."

# Одно напоминание тому, кто замолчал после ответа ассистента
[reminder]
templates = [
    "Если остались вопросы, напиши, отвечу.",
    "Я на связи. Продолжим, когда будет удобно.",
    "Если что-то по материалу неясно, напиши сюда.",
    "Остались вопросы? Пиши, отвечу.",
    "На случай, если сообщение потерялось: если что-то неясно, пиши.",
]
