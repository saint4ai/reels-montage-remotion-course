<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска раскадровки onAI Academy · Наше решение · Instagram @saint4ai</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <div class="brandtext">
      <span id="title" class="bname">Доска раскадровки onAI Academy</span>
      <a class="byline" href="https://www.instagram.com/saint4ai/" target="_blank" rel="noopener noreferrer">Наше решение · Instagram @saint4ai</a>
    </div>
  </div>
  <select id="project" title="Проект (ролик)" aria-label="Проект (ролик)"></select>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters" role="group" aria-label="Фильтры"></div>
  <div class="spacer"></div>
  <label class="author">Я: <input id="author" value="Автор" spellcheck="false" maxlength="60"></label>
  <button id="helpBtn" class="btn ghost">Как работать</button>
  <button id="summaryBtn" class="btn ghost">Сводка правок</button>
</header>
<div id="offline" role="alert" hidden>Нет связи с сервером доски. Запусти его снова (npm run board:open): сохранённые правки на месте, набранный текст остаётся в полях, страница оживёт сама.</div>
<section id="ribbon" aria-label="Лента сцен и кадров по времени"></section>
<main id="main">
  <section id="scenesSec" aria-label="Сцены" hidden></section>
  <div id="framesSec">
    <h2 class="sec-title" id="framesTitle">Кадры</h2>
    <div id="framesWrap">
      <section id="grid" aria-label="Кадры"></section>
      <aside id="panel" aria-label="Кадр"></aside>
    </div>
  </div>
</main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>Доске нужен JavaScript: включи его в браузере.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
